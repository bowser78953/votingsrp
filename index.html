<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Votingsrp.com</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font-family: system-ui, sans-serif; }
  header { background: #1e4fa8; color: #fff; display: flex; align-items: center; gap: 14px; padding: 8px 20px; }
  header img { height: 56px; width: 56px; object-fit: contain; }
  header h1 { margin: 0; font-size: 1.5rem; }
  nav { background: #12326e; display: flex; align-items: center; padding: 0 20px; }
  nav a, .dropbtn { color: #fff; text-decoration: none; padding: 12px 16px; font-size: 1rem; background: none; border: 0; cursor: pointer; font-family: inherit; }
  nav a.active { text-decoration: underline; text-underline-offset: 6px; }
  nav a:hover, .dropbtn:hover { background: rgba(255,255,255,0.12); }
  .dropdown { position: relative; }
  .dropdown-content { display: none; position: absolute; left: 0; top: 100%; min-width: 200px; background: #12326e; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .dropdown-content a { display: block; }
  .dropdown:hover .dropdown-content, .dropdown:focus-within .dropdown-content { display: block; }
  main { flex: 1; max-width: 900px; width: 100%; margin: 0 auto; padding: 24px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
  .card { background: #f3f6fc; border: 1px solid #c5d3ee; border-left: 6px solid #1e4fa8; border-radius: 8px; padding: 16px 22px; }
  .card h2 { margin: 0 0 8px; color: #12326e; font-size: 1.5rem; }
  .card p { margin: 0; line-height: 1.6; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Springfield Government logo">
  <h1>Springfield Roleplay Government Voting</h1>
</header>
<nav>
  <a href="index.html" class="active">Home Page</a>
  <div class="dropdown">
    <button class="dropbtn">Menu &#9662;</button>
    <div class="dropdown-content">
      <a href="#">SRP Senate</a>
      <a href="#">SRP House of Rep</a>
      <a href="index.html">Main Page</a>
    </div>
  </div>
</nav>
<main>
  <h2>SRP Right now</h2>
</main>
</body>
</html>

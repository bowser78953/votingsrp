<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Election Broadcast | Springfield Roleplay Government Voting</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.png" alt="Springfield Government logo">
  <h1><small>Official Site</small>Springfield Roleplay Government Voting</h1>
</header>
<nav></nav>
<section class="hero small">
  <h2>Live Election Broadcast</h2>
  <p>Watch SRP election results as they happen.</p>
</section>
<main>
  <div id="stream">
    <div class="offair"><h2><span class="dot"></span>Currently Off Air</h2><p>No election is being broadcast right now. Check back on election day.</p></div>
  </div>
  <section class="card" id="mapbox">
    <div class="mapnav"><button type="button" id="mprev" aria-label="Previous map">&#8249;</button><h2 id="mtitle">Live Results Map</h2><button type="button" id="mnext" aria-label="Next map">&#8250;</button></div>
    <div id="legend" class="legend"></div>
    <svg id="map" viewBox="0 0 847 767" role="img" aria-label="District results map"></svg>
    <div id="mdots" class="mdots"></div>
    <p id="maptotal" class="muted"></p>
  </section>
</main>
<footer>&copy; Springfield Roleplay Government Voting</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
